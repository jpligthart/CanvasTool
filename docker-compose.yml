# Local: plain `docker compose up` uses tag `local`. Release: scripts/build-and-push.ps1 sets CANVASTOOL_VERSION from VERSION.
services:
  canvastool:
    container_name: canvastool
    image: zotregistry.jelph.nl/fontysict/canvastool:latest
    build:
      context: .
      args:
        VERSION: ${CANVASTOOL_VERSION:-local}
        IMAGE_CREATED: ${IMAGE_CREATED:-unknown}
      tags:
        - zotregistry.jelph.nl/fontysict/canvastool:${CANVASTOOL_VERSION:-local}
        - zotregistry.jelph.nl/fontysict/canvastool:latest
    ports:
      - "127.0.0.1:8320:8080"
    env_file:
      - .env
    restart: unless-stopped
